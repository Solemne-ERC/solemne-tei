# SPDX-License-Identifier: MIT

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solemne-tei"
version = "0.5.0"
description = "XML-TEI schema and guidelines for encoding witnesses of early medieval canon law texts. Developed and used within the framework of SOLEMNE - The Social Life of Early Medieval Normative Texts project (ERC Consolidator grant 101087979)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gleb Schmidt" }, { name = "Friederike Voit" }, { name = "Sven Meeder" }, { name = "Radboud University" }]
requires-python = ">=3.12"
dependencies = ["lxml>=4.9.4", "saxonche>=12.4.2"]

[project.optional-dependencies]
# The build pins Saxon: the compiled Schematron it writes differs, byte for byte, between Saxon versions.
dev = ["pytest==9.2.0", "ruff==0.17.3", "saxonche==13.1.1"]

[project.urls]
Repository = "https://github.com/Solemne-ERC/solemne-tei"

[project.scripts]
solemne-tei = "solemne_tei.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["solemne_tei*"]
exclude = ["*.__pycache__"]

[tool.setuptools.package-data]
solemne_tei = ["schema/*", "tables/*", "formats/*/*.rng", "formats/*/*.xsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds the guide's PDF with LuaLaTeX, in about half a minute"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

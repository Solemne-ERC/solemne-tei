# SPDX-License-Identifier: MIT

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solemne-tei"
version = "0.1.0"
description = "XML-TEI schema and guidelines for encoding witnesses of early medieval canon law texts. Developed and used within the framework of SOLEMNE - The Social Life of Early Medieval Normative Texts project (ERC Consolidator grant 101087979)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gleb Schmidt" }, { name = "Friederike Voit" }, { name = "Sven Meeder" }, { name = "Radboud University" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.urls]
Repository = "https://github.com/Solemne-ERC/solemne-tei"

[project.scripts]
solemne-tei = "solemne_tei.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["solemne_tei*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# SPDX-License-Identifier: MIT

# The release, on a tag vX.Y.Z: the schema rebuilt from an empty cache and equal to the committed files, the tests,
# the guide's HTML and PDF; then the GitHub release with its files and the changelog's section as its notes, the
# pages (schema/X.Y.Z/, guide/X.Y.Z/ and latest/, on the gh-pages branch, keeping every earlier version). On a pull
# request, or started by hand, it's a dry run: it builds everything and keeps it as the run's artifacts, and
# publishes nothing.

name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: The release's files
    runs-on: ubuntu-latest
    # TeX Live 2025, frozen, for the PDF.
    container: texlive/texlive:TL2025-historic
    steps:
      - name: Python and git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv /opt/venv
          /opt/venv/bin/python -m pip install -e '.[dev]'
          echo /opt/venv/bin >> "$GITHUB_PATH"
      - name: A tag names the package's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(python -c 'import solemne_tei; print(solemne_tei.__version__)')"
      - name: The schema and the import formats' rebuilt from an empty cache equal the committed ones
        run: |
          solemne-tei build
          git diff --exit-code -- src/solemne_tei/schema src/solemne_tei/formats
      - name: Tests, the PDF's among them
        run: pytest
      - name: The guide as HTML and PDF
        run: solemne-tei docs --html --pdf
      - name: The release's files, notes and pages
        run: python -m solemne_tei.release assemble --out dist
      - name: Earlier releases' schemas, from their tags
        run: |
          for tag in $(git tag -l 'v*'); do
            mkdir -p "dist/earlier/${tag#v}"
            git archive "$tag" src/solemne_tei/schema | tar -x -C "dist/earlier/${tag#v}" --strip-components=3
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist
          if-no-files-found: error

  publish:
    name: The GitHub release and the pages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: The GitHub release, with the schema, the HTML and the PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/files/* --title "${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
      - name: The pages, on the gh-pages branch, keeping every earlier version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git clone --branch gh-pages --single-branch "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" site
          else
            mkdir site
            git -C site init -b gh-pages
            git -C site remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          python -m solemne_tei.release site --pages dist/pages --into site --earlier dist/earlier
          git -C site add -A
          git -C site diff --cached --quiet || git -C site commit -m "${GITHUB_REF_NAME#v}"
          git -C site push origin gh-pages

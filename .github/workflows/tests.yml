# SPDX-License-Identifier: MIT

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check
          ruff format --check
      - name: Tests
        run: pytest
      - name: The schema rebuilt from an empty cache equals the committed one
        run: |
          solemne-tei build
          git diff --exit-code -- src/solemne_tei/schema
      - name: The wheel, installed, validates outside the repository
        run: |
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          cp tests/samples/valid/*.xml "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/solemne-tei" validate --strict council-edition.xml manuscript-collection.xml export.xml
